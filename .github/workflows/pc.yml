name: PC Windows Debug
on:
  push:
    branches: [pc]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/yagay/supjav/data/**'
      - 'app/src/main/java/com/yagay/supjav/model/**'
      - 'app/src/main/java/com/yagay/supjav/player/VideoParts.kt'
      - 'app/src/main/java/com/yagay/supjav/player/PlaybackDefaults.kt'
      - 'app/src/main/java/com/yagay/supjav/player/PlaybackQueuePolicy.kt'
      - '.github/workflows/pc.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build desktop tests and Windows installer
        shell: pwsh
        run: gradle -p desktop --no-daemon test packageMsi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supjav-desktop-windows
          if-no-files-found: warn
          path: desktop/build/compose/binaries/main/msi/*.msi
