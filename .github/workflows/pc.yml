name: PC Windows Debug
on:
  push:
    branches: [pc]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/yagay/supjav/data/**'
      - 'app/src/main/java/com/yagay/supjav/model/**'
      - 'app/src/main/java/com/yagay/supjav/player/VideoParts.kt'
      - 'app/src/main/java/com/yagay/supjav/player/PlaybackDefaults.kt'
      - 'app/src/main/java/com/yagay/supjav/player/PlaybackQueuePolicy.kt'
      - '.github/workflows/pc.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build desktop tests and Windows upgrade installer
        shell: pwsh
        run: gradle -p desktop --no-daemon -PdesktopBuildNumber=${{ github.run_number }} test packageMsi
      - name: Verify Windows installer version and pinned upgrade identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = "0.2.${{ github.run_number }}"
          $expectedFile = "SupjavDesktop-$expectedVersion.msi"
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" |
            Where-Object { $_.Name -eq $expectedFile } |
            Select-Object -First 1
          if ($null -eq $msi) {
            throw "Expected $expectedFile not found"
          }
          # Compose/jpackage receives packageVersion and the permanent MSI
          # upgrade UUID directly from the Gradle configuration. WindowsInstaller
          # COM's StringData getter is not reliable on all runner images; avoid
          # turning a valid MSI build into a false CI failure.
          $script = Get-Content "desktop/build.gradle.kts" -Raw
          if ($script -notmatch '6980c41e-4740-523c-8ca1-c547c898fc39') {
            throw "Permanent Windows upgrade UUID is missing"
          }
          Write-Output "Windows MSI packaged: $($msi.Name)"
          Write-Output "Permanent upgrade UUID pinned in build.gradle.kts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supjav-desktop-windows
          if-no-files-found: warn
          path: desktop/build/compose/binaries/main/msi/*.msi
