name: Android Debug
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 37 SDK
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: SDK 37 legacy path compatibility
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Compile Debug only
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supjav-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
